name: (Optional, direct APIs) Draw and post a cartoon to LinkedIn and X

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = only draw the image and print the text, post nothing"
        default: "0"

permissions:
  contents: write

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow (free)
        run: pip install pillow
      - name: Draw the image and post it
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python scripts/social_post.py
      - name: Keep the image and the post history
        if: always()
        run: |
          git config user.name "marketing-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p state social/out
          git add state social/out
          git diff --cached --quiet || (git commit -m "Social post history and image" && git push)
      - name: Attach the image to the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartoon
          path: social/out/*.png
          if-no-files-found: ignore
