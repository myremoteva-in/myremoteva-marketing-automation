name: IndexNow ping (new and changed pages)

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      all_urls:
        description: "Submit every sitemap URL (1) or only recent ones (0)"
        default: "0"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Submit changed URLs to IndexNow
        env:
          ALL: ${{ github.event.inputs.all_urls }}
          DAYS: "3"
        run: python scripts/indexnow.py
